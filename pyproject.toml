[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muonscope-research"
version = "0.1.0"
description = "Reproducible cosmic-muon radiography and detector-readout research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name="Burhan Karaduman"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]
keywords = ["muon", "radiography", "Geant4", "photomultiplier", "coincidence", "scintillator"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
muonscope = "muonscope.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=100

[tool.ruff.lint]
select=["E4", "E7", "E9", "F", "I"]
